<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cassa Gelateria Dolce Freschezza</title>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
background:#fff5ea;
}

header{
background:linear-gradient(90deg,#ff6f91,#ff9f43);
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}


button{
border:0;
border-radius:18px;
padding:12px;
margin:5px;
background:#ff9f43;
color:white;
font-size:16px;
font-weight:bold;
}


.login{
text-align:center;
padding:50px;
}


.cassa{
display:none;
padding:15px;
}


.menu{
display:flex;
flex-wrap:wrap;
}


.prodotti{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}


.prodotto{
background:white;
color:#333;
box-shadow:0 4px 10px #ccc;
}


.box{
background:white;
border-radius:20px;
padding:15px;
margin-top:15px;
}


table{
width:100%;
border-collapse:collapse;
}


td,th{
padding:8px;
border-bottom:1px solid #ddd;
}


#totale{
font-size:35px;
font-weight:bold;
color:green;
}


.nascosto{
display:none;
}

</style>

</head>


<body>


<header>
🍦 CASSA GELATERIA DOLCE FRESCHEZZA 🍦
</header>


<div class="login" id="login">

<h2>Chi entra in cassa?</h2>

<button onclick="entra('Chiara')">
👩 Chiara
</button>

<button onclick="entra('Giulia')">
👩 Giulia
</button>

</div>



<div class="cassa" id="cassa">


<h2 id="cassiera"></h2>


<div class="menu">

<button onclick="gelateria()">
🍦 Gelato
</button>

<button onclick="mostraProdotti('bibite')">
🥤 Bibite
</button>

<button onclick="mostraProdotti('granite')">
🧊 Granite
</button>

<button onclick="mostraProdotti('bubble')">
🧋 Bubble Tea
</button>

<button onclick="mostraProdotti('dolci')">
🥞 Dolci
</button>

<button onclick="mostraProdotti('yogurt')">
🍨 Yogurt
</button>

</div>


<div id="prodotti" class="prodotti"></div>



<div id="sceltaGelato" class="box nascosto">

<h2>🍦 Tipo gelato</h2>

<button onclick="iniziaGelato('Cono 1 gusto',2.5,1)">
Cono 1 gusto €2,50
</button>

<button onclick="iniziaGelato('Cono 2 gusti',3,2)">
Cono 2 gusti €3
</button>

<button onclick="iniziaGelato('Cono 3 gusti',4,3)">
Cono 3 gusti €4
</button>

<button onclick="iniziaGelato('Coppetta',3,2)">
Coppetta €3
</button>


</div>


<div id="gusti" class="box nascosto">

<h2>🍨 Scegli i gusti</h2>

<div id="listaGusti"></div>

</div>


<div id="aggiunte" class="box nascosto">

<h2>➕ Aggiunte</h2>

<button onclick="aggiunta('Panna montata',0.5)">
🍦 Panna +€0,50
</button>

<button onclick="aggiunta('Nutella',0.5)">
🍫 Nutella +€0,50
</button>

<button onclick="aggiunta('Granella nocciola',0.5)">
🌰 Granella +€0,50
</button>

</div>
<div class="box">

<h2>🧾 Ordine</h2>

<table>

<thead>
<tr>
<th>Prodotto</th>
<th>Prezzo</th>
</tr>
</thead>

<tbody id="ordine">
</tbody>

</table>


<h2>
Totale
</h2>

<div id="totale">
€0.00
</div>


<h2>💶 Pagamento</h2>

<input id="soldi" type="number" placeholder="Soldi cliente">


<button onclick="contanti()">
💵 Contanti
</button>

<button onclick="carta()">
💳 Carta
</button>


<div id="resto"></div>


<button onclick="nuovoOrdine()">
🔄 Nuovo cliente
</button>

</div>



<script>

let totale=0;
let ordine=[];
let gustiScelti=[];
let gustiDaScegliere=0;


const gusti=[

"🍫 Cioccolato",
"🍓 Fragola",
"🥜 Pistacchio",
"🌰 Nocciola",
"🍦 Crema",
"🍨 Vaniglia",
"🍪 Biscotto",
"🍫 Stracciatella",
"🍒 Amarena",
"🍋 Limone",
"🥥 Cocco",
"🥭 Mango",
"🫐 Frutti di bosco",
"🍫 Kinder",
"🍪 Oreo",
"🍬 Pinguino",
"🩵 Puffo",
"🍰 Tiramisù"

];



const prodotti={


bibite:[
["🥤 Coca Cola",2],
["🍊 Fanta",2],
["🍋 Sprite",2],
["💧 Acqua",1],
["🧃 Tè Pesca",2]
],


granite:[
["🧊 Limone",3],
["🧊 Fragola",3],
["🧊 Mango",3]
],


bubble:[
["🧋 Bubble Mango",5],
["🧋 Bubble Fragola",5]
],


dolci:[
["🥞 Crêpes Nutella",5],
["🧇 Waffle",4],
["🍩 Donut",3]
],


yogurt:[
["🍨 Yogurt piccolo",3],
["🍨 Yogurt grande",5]
]

};



function entra(nome){

document.getElementById("login").style.display="none";

document.getElementById("cassa").style.display="block";

document.getElementById("cassiera").innerHTML=
"👩 Cassiera: "+nome;

}



function gelateria(){

document.getElementById("sceltaGelato").classList.remove("nascosto");

document.getElementById("prodotti").innerHTML="";

}



function iniziaGelato(nome,prezzo,numero){

ordine.push({
nome:nome,
prezzo:prezzo
});

totale+=prezzo;

gustiDaScegliere=numero;

gustiScelti=[];


document.getElementById("gusti").classList.remove("nascosto");


let box=document.getElementById("listaGusti");

box.innerHTML="";


gusti.forEach(g=>{

let b=document.createElement("button");

b.innerHTML=g;

b.onclick=function(){

if(gustiScelti.length<gustiDaScegliere){

gustiScelti.push(g);

if(gustiScelti.length==gustiDaScegliere){

ordine[ordine.length-1].nome +=
"<br>"+gustiScelti.join(" ");

aggiorna();

}

}

};


box.appendChild(b);

});


}



function aggiunta(nome,prezzo){

ordine.push({
nome:nome,
prezzo:prezzo
});

totale+=prezzo;

aggiorna();

}



function mostraProdotti(tipo){

let box=document.getElementById("prodotti");

box.innerHTML="";


prodotti[tipo].forEach(p=>{

let b=document.createElement("button");

b.className="prodotto";

b.innerHTML=p[0]+"<br>€"+p[1];


b.onclick=function(){

ordine.push({
nome:p[0],
prezzo:p[1]
});

totale+=p[1];

aggiorna();

};


box.appendChild(b);


});


}



function aggiorna(){

let box=document.getElementById("ordine");

box.innerHTML="";


ordine.forEach(p=>{

box.innerHTML+=`

<tr>
<td>${p.nome}</td>
<td>€${p.prezzo.toFixed(2)}</td>
</tr>

`;

});


document.getElementById("totale").innerHTML=
"€"+totale.toFixed(2);

}



function contanti(){

let soldi=Number(document.getElementById("soldi").value);


let resto=soldi-totale;


document.getElementById("resto").innerHTML=
"💶 Resto cliente: €"+resto.toFixed(2);


}



function carta(){

alert("💳 Pagamento carta completato");

nuovoOrdine();

}



function nuovoOrdine(){

ordine=[];

totale=0;

document.getElementById("soldi").value="";

document.getElementById("resto").innerHTML="";

aggiorna();

}


</script>


</body>

</html>
