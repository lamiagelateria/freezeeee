<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gelateria Dolce Freschezza</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(#ffe6f2,#fff8e7);
    text-align:center;
}

header {
    background:#ff7eb3;
    color:white;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

h2 {
    color:#d35400;
}

.container {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card {
    background:white;
    width:150px;
    margin:10px;
    padding:15px;
    border-radius:25px;
    box-shadow:0 4px 10px #ccc;
}

.card img {
    width:100px;
    height:100px;
    border-radius:50%;
}

button {
    background:#ff9f43;
    color:white;
    border:0;
    padding:10px;
    border-radius:20px;
    margin:5px;
    font-size:15px;
}

button:hover {
    background:#e67e22;
}

#carrello {
    background:white;
    margin:20px;
    padding:20px;
    border-radius:25px;
    box-shadow:0 4px 10px #ccc;
}

#totale {
    font-size:35px;
    color:green;
    font-weight:bold;
}

.reset {
    background:#e74c3c;
}
</style>

</head>

<body>

<header>
🍦 Gelateria Dolce Freschezza 🍦
</header>

<h2>Menu</h2>

<div class="container"><div class="card">
<img src="https://i.imgur.com/9Qy7Q9F.png">
<h3>🍦 Gelato</h3>
<button onclick="aggiungi('Gelato 1 gusto',2.5)">1 gusto €2,50</button>
<button onclick="aggiungi('Gelato 2 gusti',3)">2 gusti €3,00</button>
<button onclick="aggiungi('Gelato 3 gusti',4)">3 gusti €4,00</button>
</div>

<div class="card">
<img src="https://i.imgur.com/7QZ6Q5E.png">
<h3>🍨 Yogurt</h3>
<button onclick="aggiungi('Yogurt piccolo',3.5)">Piccolo €3,50</button>
<button onclick="aggiungi('Yogurt medio',4.5)">Medio €4,50</button>
<button onclick="aggiungi('Yogurt grande',5.5)">Grande €5,50</button>
</div>

<div class="card">
<img src="https://i.imgur.com/4M7IWwK.png">
<h3>🧋 Bubble Tea</h3>
<button onclick="aggiungi('Bubble Tea Mango',5.5)">🥭 Mango</button>
<button onclick="aggiungi('Bubble Tea Fragola',5.5)">🍓 Fragola</button>
<button onclick="aggiungi('Bubble Tea Pesca',5.5)">🍑 Pesca</button>
</div>

<div class="card">
<img src="https://i.imgur.com/yX2Q9yF.png">
<h3>🥞 Crêpes</h3>
<button onclick="aggiungi('Crêpes',5)">€5,00</button>
</div>

<div class="card">
<img src="https://i.imgur.com/LmF7y7F.png">
<h3>🧊 Granita</h3>
<button onclick="aggiungi('Granita piccola',2.5)">Piccola €2,50</button>
<button onclick="aggiungi('Granita grande',4.5)">Grande €4,50</button>
</div><div id="carrello">
<h2>🛒 Ordine cliente</h2>

<div id="lista">
Nessun prodotto scelto
</div>

<h2>Totale</h2>
<div id="totale">
€0,00
</div>

<button class="reset" onclick="azzera()">
🔄 Nuovo cliente
</button>

</div>

<script>

let totale = 0;
let ordine = [];

function aggiungi(nome, prezzo){

    ordine.push(nome);

    totale += prezzo;

    document.getElementById("lista").innerHTML =
    ordine.map(x => "🍦 " + x).join("<br>");

    document.getElementById("totale").innerHTML =
    "€" + totale.toFixed(2);

}

function azzera(){

    totale = 0;
    ordine = [];

    document.getElementById("lista").innerHTML =
    "Nessun prodotto scelto";

    document.getElementById("totale").innerHTML =
    "€0,00";
}

</script>

</body>
</html>

</div>
