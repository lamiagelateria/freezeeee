<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gelateria Dolce Freschezza</title>

<style>
body{
margin:0;
font-family:Arial;
background:#fff0f5;
}

header{
background:linear-gradient(90deg,#ff6f91,#ff9f43);
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.login{
text-align:center;
padding:40px;
}

button{
border:0;
border-radius:20px;
padding:12px;
margin:5px;
background:#ff9f43;
color:white;
font-size:16px;
cursor:pointer;
}

.cassa{
display:none;
padding:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.card{
background:white;
padding:15px;
border-radius:20px;
box-shadow:0 3px 10px #ccc;
}

#ordine{
background:white;
padding:15px;
border-radius:20px;
margin-top:20px;
}

#totale{
font-size:35px;
color:green;
font-weight:bold;
}
</style>

</head>

<body>

<header>
🍦 Gelateria Dolce Freschezza 🍦
</header>


<div class="login" id="login">

<h2>Chi entra in cassa?</h2>

<button onclick="entra('Chiara')">
👩 Chiara
</button>

<button onclick="entra('Giulia')">
👩 Giulia
</button>

</div>


<div class="cassa" id="cassa">

<h2 id="cassiera"></h2>

<h2>🍦 Gelati</h2>

<div class="grid">

<button onclick="aggiungi('Cioccolato',2.5)">🍫 Cioccolato</button>
<button onclick="aggiungi('Fragola',2.5)">🍓 Fragola</button>
<button onclick="aggiungi('Pistacchio',2.5)">🥜 Pistacchio</button>
<button onclick="aggiungi('Nocciola',2.5)">🌰 Nocciola</button>
<button onclick="aggiungi('Vaniglia',2.5)">🍨 Vaniglia</button>
<button onclick="aggiungi('Stracciatella',2.5)">🍫 Stracciatella</button>
<button onclick="aggiungi('Cookies',2.5)">🍪 Cookies</button>
<button onclick="aggiungi('Caramello',2.5)">🍯 Caramello</button>
<button onclick="aggiungi('Tiramisù',2.5)">🍰 Tiramisù</button>
<button onclick="aggiungi('Mango',2.5)">🥭 Mango</button>

</div>
<h2>🍨 Extra</h2>

<div class="grid">

<button onclick="aggiungi('Yogurt piccolo',3)">
🍨 Yogurt piccolo €3
</button>

<button onclick="aggiungi('Yogurt grande',5)">
🍨 Yogurt grande €5
</button>

<button onclick="aggiungi('Bubble Tea Mango',5)">
🧋 Bubble Mango €5
</button>

<button onclick="aggiungi('Granita Limone',3)">
🧊 Granita Limone €3
</button>

<button onclick="aggiungi('Coca Cola',2)">
🥤 Coca Cola €2
</button>

<button onclick="aggiungi('Acqua',1)">
💧 Acqua €1
</button>

</div>


<h2>🧾 Ordine</h2>

<div id="ordine">
Nessun prodotto
</div>


<h2>Totale</h2>

<div id="totale">
€0.00
</div>


<button onclick="pagamento()">
💳 Paga
</button>

<button onclick="nuovoOrdine()">
🔄 Nuovo ordine
</button>


</div>


<script>

let totale=0;
let prodotti=[];


function entra(nome){

document.getElementById("login").style.display="none";

document.getElementById("cassa").style.display="block";

document.getElementById("cassiera").innerHTML=
"👩 Cassiera: "+nome;

}



function aggiungi(nome,prezzo){

prodotti.push(nome);

totale+=prezzo;

aggiorna();

}



function aggiorna(){

document.getElementById("ordine").innerHTML=
prodotti.join("<br>");

document.getElementById("totale").innerHTML=
"€"+totale.toFixed(2);

}



function pagamento(){

if(totale==0){

alert("Aggiungi un prodotto");

return;

}

alert(
"Pagamento completato!\nTotale €"+
totale.toFixed(2)
);

nuovoOrdine();

}



function nuovoOrdine(){

totale=0;

prodotti=[];

aggiorna();

}

</script>

</body>
</html>
