<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cassa Gelateria Dolce Freschezza</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff5ea;
}

header{
background:linear-gradient(90deg,#ff6f91,#ff9f43);
color:white;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

button{
border:0;
border-radius:18px;
padding:12px;
margin:5px;
background:#ff9f43;
color:white;
font-size:16px;
font-weight:bold;
}

.login{
text-align:center;
padding:40px;
}

.cassa{
display:none;
padding:15px;
}

.categorie{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.prodotti{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.prodotto{
background:white;
color:#333;
box-shadow:0 4px 10px #ccc;
}

.ordine{
background:white;
padding:15px;
border-radius:20px;
margin-top:15px;
}

#totale{
font-size:35px;
color:green;
font-weight:bold;
}

.calcolatrice button{
background:#555;
width:55px;
}

</style>
</head>

<body>

<header>
🍦 CASSA GELATERIA DOLCE FRESCHEZZA 🍦
</header>


<div class="login" id="login">

<h2>Chi entra in cassa?</h2>

<button onclick="entra('Chiara')">
👩 Chiara
</button>

<button onclick="entra('Giulia')">
👩 Giulia
</button>

</div>



<div class="cassa" id="cassa">

<h2 id="cassiera"></h2>


<div class="categorie">

<button onclick="mostra('gelati')">🍦 Gelati</button>
<button onclick="mostra('yogurt')">🍨 Yogurt</button>
<button onclick="mostra('granite')">🧊 Granite</button>
<button onclick="mostra('bibite')">🥤 Bibite</button>
<button onclick="mostra('bubble')">🧋 Bubble Tea</button>
<button onclick="mostra('dolci')">🥞 Dolci</button>

</div>


<div id="prodotti" class="prodotti"></div>


<div class="ordine">

<h2>🧾 Scontrino</h2>

<div id="scontrino">
Nessun prodotto
</div>


<h2>Totale</h2>

<div id="totale">
€0.00
</div>
<input id="soldi" placeholder="Soldi ricevuti €" readonly>

<div class="calcolatrice">

<button onclick="numero(1)">1</button>
<button onclick="numero(2)">2</button>
<button onclick="numero(3)">3</button>

<button onclick="numero(4)">4</button>
<button onclick="numero(5)">5</button>
<button onclick="numero(6)">6</button>

<button onclick="numero(7)">7</button>
<button onclick="numero(8)">8</button>
<button onclick="numero(9)">9</button>

<button onclick="numero(0)">0</button>
<button onclick="cancella()">❌</button>

</div>


<button onclick="contanti()">
💵 Contanti
</button>

<button onclick="carta()">
💳 Carta
</button>


<div id="resto"></div>


<button onclick="nuovoOrdine()">
🔄 Nuovo ordine
</button>


</div>


</div>


<script>

let totale=0;
let ordine=[];


const prodotti={

gelati:[
["🍫 Cioccolato",2.5],
["🍓 Fragola",2.5],
["🥜 Pistacchio",2.5],
["🌰 Nocciola",2.5],
["🍦 Crema",2.5],
["🍨 Vaniglia",2.5],
["🍋 Limone",2.5],
["🍒 Amarena",2.5],
["🍪 Biscotto",2.5],
["🍫 Stracciatella",2.5],
["☕ Caffè",2.5],
["🥥 Cocco",2.5],
["🍌 Banana",2.5],
["🥭 Mango",2.5],
["🍑 Pesca",2.5],
["🫐 Frutti di bosco",2.5],
["🍫 Ciocco bianco",2.5],
["🍪 Cookies",2.5],
["🍯 Caramello",2.5],
["🍰 Tiramisù",2.5]
],

yogurt:[
["🍨 Yogurt piccolo",3],
["🍨 Yogurt grande",5],
["🍫 Nutella",1.5],
["🍓 Fragole",1.5]
],

granite:[
["🍋 Limone",3],
["🍓 Fragola",3],
["🥭 Mango",3],
["🍒 Amarena",3]
],

bibite:[
["🥤 Coca Cola",2],
["🍊 Fanta",2],
["🍋 Sprite",2],
["💧 Acqua",1],
["🧃 Tè Pesca",2]
],

bubble:[
["🧋 Bubble Mango",5],
["🧋 Bubble Fragola",5],
["🧋 Bubble Pesca",5]
],

dolci:[
["🥞 Crêpes Nutella",5],
["🧇 Waffle",4],
["🍩 Donut",3]
]

};



function entra(nome){

document.getElementById("login").style.display="none";

document.getElementById("cassa").style.display="block";

document.getElementById("cassiera").innerHTML=
"👩 Cassiera: "+nome;

}



function mostra(tipo){

let box=document.getElementById("prodotti");

box.innerHTML="";


prodotti[tipo].forEach(p=>{

let b=document.createElement("button");

b.className="prodotto";

b.innerHTML=p[0]+"<br>€"+p[1].toFixed(2);


b.onclick=function(){

aggiungi(p[0],p[1]);

};


box.appendChild(b);

});

}



function aggiungi(nome,prezzo){

ordine.push(nome);

totale+=prezzo;

aggiorna();

}



function aggiorna(){

document.getElementById("scontrino").innerHTML=
ordine.join("<br>");

document.getElementById("totale").innerHTML=
"€"+totale.toFixed(2);

}



function numero(n){

document.getElementById("soldi").value += n;

}



function cancella(){

document.getElementById("soldi").value="";

}



function contanti(){

let soldi=Number(document.getElementById("soldi").value);

let resto=soldi-totale;


document.getElementById("resto").innerHTML=
"💶 Resto cliente: €"+resto.toFixed(2);

alert("Pagamento completato 🧾");

}



function carta(){

alert("💳 Pagamento con carta completato!");

nuovoOrdine();

}



function nuovoOrdine(){

totale=0;

ordine=[];

document.getElementById("soldi").value="";

document.getElementById("resto").innerHTML="";

aggiorna();

}


mostra("gelati");


</script>

</body>
</html>
