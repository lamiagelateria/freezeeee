<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cassa Gelateria Dolce Freschezza</title>

<style>

*{
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
margin:0;
background:#fff4e6;
}


/* TESTATA */

header{
height:75px;
background:linear-gradient(90deg,#ff6f91,#ff9f43);
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
}



/* STRUTTURA CASSA */

.cassa{
display:flex;
height:calc(100vh - 75px);
}



/* CATEGORIE */

.menu{
width:210px;
background:#ffd6e0;
padding:15px;
}


.menu h2{
text-align:center;
color:#d35400;
}


.menu button{

width:100%;
height:60px;
margin-bottom:12px;

border:0;
border-radius:20px;

background:#ff9f43;
color:white;

font-size:18px;
font-weight:bold;

cursor:pointer;

}



/* AREA PRODOTTI */

.prodotti{
flex:1;
padding:20px;
overflow:auto;
}


.griglia{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

}



.prodotto{

height:110px;

background:white;

border:0;

border-radius:25px;

box-shadow:0 5px 15px #ccc;

font-size:17px;

cursor:pointer;

transition:0.2s;

}



.prodotto:hover{

transform:scale(1.05);

background:#fff1a8;

}



/* ORDINE */

.ordine{

width:330px;

background:white;

padding:20px;

box-shadow:-5px 0 15px #ccc;

}



.ordine h2{

text-align:center;

color:#d35400;

}



#lista{

height:45vh;

overflow:auto;

border:2px solid #eee;

border-radius:15px;

padding:10px;

}



.riga{

display:flex;

justify-content:space-between;

margin:8px 0;

}



#totale{

font-size:40px;

font-weight:bold;

color:green;

text-align:center;

}



.tasto{

width:100%;

height:60px;

border:0;

border-radius:20px;

margin-top:10px;

font-size:20px;

color:white;

background:#27ae60;

cursor:pointer;

}



.reset{

background:#e74c3c;

}



</style>

</head>


<body>


<header>
🍦 CASSA GELATERIA DOLCE FRESCHEZZA 🍦
</header>


<div class="cassa">


<div class="menu">

<h2>Menu</h2>

<button onclick="categoria('gelati')">
🍦 Gelati
</button>

<button onclick="categoria('yogurt')">
🍨 Yogurt
</button>

<button onclick="categoria('bubble')">
🧋 Bubble Tea
</button>

<button onclick="categoria('dolci')">
🥞 Dolci
</button>

<button onclick="categoria('granite')">
🧊 Granite
</button>

<button onclick="categoria('bibite')">
🥤 Bibite
</button>


</div>



<div class="prodotti">

<div class="griglia" id="griglia">

</div>

</div>



<div class="ordine">

<h2>🧾 Ordine</h2>

<div id="lista">
Nessun prodotto
</div>


<h2>Totale</h2>

<div id="totale">
€0.00
</div>


<button class="tasto" onclick="pagamento()">
💳 Paga
</button>


<button class="tasto reset" onclick="nuovoOrdine()">
🔄 Nuovo ordine
</button>


</div>


</div>
<script>


let ordine = [];

let totale = 0;



const prodotti = {


gelati:[

["🍦 Cono 1 gusto",2.50],
["🍦 Cono 2 gusti",3],
["🍦 Cono 3 gusti",4],
["🥣 Coppetta 1 gusto",2.50],
["🥣 Coppetta 2 gusti",3],
["🥣 Coppetta 3 gusti",4],
["🍫 Cioccolato",0],
["🍓 Fragola",0],
["🥜 Pistacchio",0],
["🌰 Nocciola",0],
["🍦 Crema",0],
["🍨 Vaniglia",0]

],



yogurt:[

["🍨 Yogurt piccolo",3],
["🍨 Yogurt medio",4],
["🍨 Yogurt grande",5],
["🍫 Nutella extra",1.5],
["🍓 Fragole extra",1.5],
["🍪 Biscotti extra",1.5]

],



bubble:[

["🧋 Bubble Mango",5],
["🧋 Bubble Fragola",5],
["🧋 Bubble Pesca",5],
["🧋 Bubble Classico",5]

],



dolci:[

["🥞 Crêpes Nutella",5],
["🥞 Crêpes Pistacchio",5],
["🧇 Waffle",4],
["🍰 Tiramisù",4]

],



granite:[

["🧊 Granita Limone",3],
["🧊 Granita Fragola",3],
["🧊 Granita Mango",3],
["🧊 Granita Amarena",3]

],



bibite:[

["🥤 Coca Cola",2],
["🍊 Fanta",2],
["🍋 Sprite",2],
["💧 Acqua",1],
["🧃 Tè Pesca",2]

]


};





function categoria(nome){


let box=document.getElementById("griglia");


box.innerHTML="";


prodotti[nome].forEach(p=>{


let b=document.createElement("button");


b.className="prodotto";


b.innerHTML=
p[0]+"<br>€"+p[1].toFixed(2);



b.onclick=function(){

aggiungi(p[0],p[1]);

};



box.appendChild(b);


});


}





function aggiungi(nome,prezzo){


let trovato=ordine.find(x=>x.nome===nome);


if(trovato){

trovato.quantita++;

}else{


ordine.push({

nome:nome,

prezzo:prezzo,

quantita:1

});


}


aggiorna();


}





function rimuovi(indice){


ordine.splice(indice,1);


aggiorna();


}







function aggiorna(){


let lista=document.getElementById("lista");


lista.innerHTML="";


totale=0;



if(ordine.length===0){

lista.innerHTML="Nessun prodotto";


}else{


ordine.forEach((p,i)=>{


totale += p.prezzo*p.quantita;



lista.innerHTML +=

`

<div class="riga">

<span>

${p.nome}

x${p.quantita}

</span>


<button onclick="rimuovi(${i})">

❌

</button>


</div>

`;



});


}



document.getElementById("totale").innerHTML=

"€"+totale.toFixed(2);



}
function nuovoOrdine(){

ordine=[];

totale=0;

aggiorna();

}



function pagamento(){


if(totale===0){

alert("Inserisci prima dei prodotti nell'ordine!");

return;

}


let metodo=prompt(
"Metodo di pagamento:\n1 = Contanti\n2 = Carta"
);



if(metodo=="1"){

alert(
"Pagamento in contanti completato!\nTotale: €"+
totale.toFixed(2)
);

}



else if(metodo=="2"){

alert(
"Pagamento con carta completato!\nTotale: €"+
totale.toFixed(2)
);

}


else{

alert("Metodo non valido");

return;

}



nuovoOrdine();


}




// apre automaticamente i gelati

categoria("gelati");


</script>


</body>

</html>
